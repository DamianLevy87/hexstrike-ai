<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HexStrike AI — Console</title>
<link rel="icon" href="/assets/hexstrike-logo.png">
<style>
:root{
  --bg:#0a0b0f; --panel:#12141a; --panel2:#171a22; --line:#23262f;
  --fg:#d7dce5; --dim:#8b92a5; --accent:#ff3b3b; --green:#2ecc71;
  --amber:#f39c12; --blue:#4aa8ff; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--mono)}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#12141a,#0d0e13);position:sticky;top:0;z-index:5}
header img{height:34px;width:34px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(255,59,59,.45))}
h1{font-size:17px;margin:0;letter-spacing:.5px}
h1 small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
.spacer{flex:1}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
.pill.ok{color:var(--green);border-color:#1d5c38;background:#0e2018}
.pill.bad{color:var(--accent);border-color:#5c1d1d;background:#200e0e}
.pill.warn{color:var(--amber);border-color:#5c4a1d;background:#201a0e}
main{max-width:1180px;margin:0 auto;padding:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.card .v{font-size:20px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .v.ok{color:var(--green)} .card .v.warn{color:var(--amber)} .card .v.bad{color:var(--accent)}
.meter{height:6px;background:#262a35;border-radius:4px;margin-top:8px;overflow:hidden}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--amber));transition:width .4s}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:22px;overflow:hidden}
section>h2{font-size:13px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--fg);
  display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:1px}
section>h2 .n{color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0}
.proc{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;
  grid-template-columns:110px 1fr 210px;gap:14px;align-items:center}
.proc:last-child{border-bottom:0}
.proc .pid{color:var(--amber)}
.proc .cmd{color:var(--fg);word-break:break-all;font-size:12.5px}
.proc .out{color:var(--dim);font-size:11.5px;margin-top:3px;word-break:break-all}
.proc .meta{color:var(--dim);font-size:12px;text-align:right}
.empty{padding:16px;color:var(--dim)}
.tools{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--dim)}
.chip.miss{color:var(--accent);border-color:#4a1d1d;background:#1b0f0f}
.explorer{padding:12px 16px}
.row1{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:220px;background:var(--bg);border:1px solid var(--line);color:var(--fg);
  border-radius:8px;padding:8px 12px;font:13px var(--mono);outline:none}
input[type=search]:focus{border-color:var(--accent)}
label.auto{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer}
button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;
  padding:7px 14px;font:12.5px var(--mono);cursor:pointer}
button:hover{border-color:var(--accent);color:#fff}
button.primary{border-color:#5c1d1d;background:#1c0f10;color:#ffb3b3}
.grp{margin:14px 0 4px;color:var(--blue);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.ep{display:flex;align-items:center;gap:10px;padding:4px 6px;border-radius:6px;font-size:12.5px}
.ep:hover{background:var(--panel2)}
.ep .m{flex:none;min-width:44px;color:var(--green)}
.ep .m.m-post{color:var(--blue)}
.ep .m.m-delete{color:var(--amber)}
.ep .m.m-put,.ep .m.m-patch{color:var(--dim)}
.ep .p{flex:1;word-break:break-all;cursor:pointer;color:var(--fg)}
.ep .p:hover{color:#fff;text-decoration:underline}
.ep .run{padding:3px 10px;font-size:11px}
.ep .params{color:var(--amber);font-size:11px;flex:none}
#resp{display:none;border-top:1px solid var(--line)}
#resp .head{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--dim);font-size:12.5px}
#resp pre{margin:0;padding:14px 16px;background:#0c0d12;border-top:1px solid var(--line);
  max-height:420px;overflow:auto;font-size:12px;color:#bcd3e8;white-space:pre-wrap;word-break:break-all}
footer{color:var(--dim);font-size:11.5px;text-align:center;padding:10px 0 26px}
footer a{color:var(--dim)}
@media(max-width:760px){.proc{grid-template-columns:1fr}.proc .meta{text-align:left}}
</style>
</head>
<body>
<header>
  <img src="/assets/hexstrike-logo.png" alt="HexStrike">
  <h1>HEXSTRIKE AI<small id="ver">console</small></h1>
  <span class="spacer"></span>
  <span class="pill" id="uptime">–</span>
  <span class="pill" id="statusPill">connecting…</span>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div class="cards" id="syscards"></div>

  <section>
    <h2>⚡ Live processes <span class="n" id="procCount"></span></h2>
    <div id="procs"><div class="empty">loading…</div></div>
  </section>

  <section>
    <h2>🛠 Toolchain <span class="n" id="toolsSummary"></span></h2>
    <div class="tools" id="missing"><div class="empty">loading…</div></div>
  </section>

  <section>
    <h2>🔌 API explorer <span class="n" id="epCount"></span></h2>
    <div class="explorer">
      <div class="row1">
        <input type="search" id="q" placeholder="filter endpoints… e.g. nmap, scan, ai" autocomplete="off">
        <label class="auto"><input type="checkbox" id="auto" checked> auto-refresh 5s</label>
        <button id="refreshNow" class="primary">↻ refresh</button>
      </div>
      <div id="eplist"></div>
    </div>
    <div id="resp">
      <div class="head"><b id="respUrl"></b><span class="pill" id="respCode"></span>
        <span id="respMs"></span><span class="spacer"></span>
        <button id="respClose">close</button></div>
      <pre id="respOut"></pre>
    </div>
  </section>
  <footer>HexStrike AI Tools API Server — JSON service index at <a href="/api">/api</a> · health at <a href="/health">/health</a></footer>
</main>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; };
const jget = async url => {
  const r = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
};
const fmtUptime = s => s >= 3600 ? (s/3600).toFixed(1)+'h' : s >= 60 ? Math.floor(s/60)+'m '+Math.floor(s%60)+'s' : Math.floor(s)+'s';

/* ---------- status cards ---------- */
function card(k, v, cls, meter) {
  return `<div class="card"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div>` +
         (meter != null ? `<div class="meter"><i style="width:${meter}%"></i></div>` : '') + `</div>`;
}
async function loadHealth() {
  try {
    const h = await jget('/health');
    const pct = h.total_tools_count ? Math.round(100 * h.total_tools_available / h.total_tools_count) : 0;
    const missing = Object.entries(h.tools_status || {}).filter(([, v]) => v === false).map(([k]) => k);
    $('#statusPill').textContent = h.status; $('#statusPill').className = 'pill ' + (h.status === 'healthy' ? 'ok' : 'bad');
    $('#ver').textContent = 'v' + (h.version || '?') + ' · API console';
    $('#uptime').textContent = 'up ' + fmtUptime(h.uptime || 0);
    $('#toolsSummary').textContent = missing.length ? `${missing.length} missing: ` + missing.slice(0, 12).join(', ') + (missing.length > 12 ? '…' : '') : 'all present';
    $('#missing').innerHTML = missing.length
      ? missing.map(m => `<span class="chip miss">${esc(m)}</span>`).join('')
      : '<span class="chip">every tool installed 🎉</span>';
    $('#cards').innerHTML =
      card('Tools', `${h.total_tools_available} / ${h.total_tools_count}`, pct > 90 ? 'ok' : 'warn', pct) +
      card('Essential', h.all_essential_tools_available ? '✓ all present' : '✗ missing', h.all_essential_tools_available ? 'ok' : 'bad') +
      card('Status', esc(h.status), h.status === 'healthy' ? 'ok' : 'bad') +
      card('Cache hit rate', esc((h.cache_stats || {}).hit_rate || '–')) +
      card('Commands run', ((h.telemetry || {}).commands_executed ?? '–')) +
      card('Success rate', esc(((h.telemetry || {}).success_rate) ?? '–'));
    return true;
  } catch (e) {
    $('#statusPill').textContent = 'unreachable'; $('#statusPill').className = 'pill bad';
    return false;
  }
}

/* ---------- live processes ---------- */
async function loadProcs() {
  try {
    const d = await jget('/api/processes/dashboard');
    const ps = d.processes || [];
    $('#procCount').textContent = ps.length ? `${ps.length} active` : '';
    $('#procs').innerHTML = ps.length ? ps.map(p => {
      const pct = parseFloat(p.progress_percent) || 0;
      const st = (p.status || '').toLowerCase();
      return `<div class="proc">
        <div><span class="pill ${st === 'running' ? 'ok' : 'warn'}">${esc(p.status || '?')}</span>
          <div class="pid">PID ${esc(p.pid)}</div></div>
        <div><div class="cmd" title="${esc(p.command)}">${esc(p.command)}</div>
          <div class="meter"><i style="width:${pct}%"></i></div>
          <div class="out">${esc(p.last_output || '')}</div></div>
        <div class="meta">${esc(p.progress_percent || '')} · ETA ${esc(p.eta || '–')} · runtime ${esc(p.runtime || '–')}</div>
      </div>`;
    }).join('') : '<div class="empty">no managed processes</div>';
    const sl = d.system_load || {};
    $('#syscards').innerHTML =
      card('CPU', (sl.cpu_percent ?? '–') + '%', sl.cpu_percent > 80 ? 'bad' : '') +
      card('Memory', (sl.memory_percent ?? '–') + '%', sl.memory_percent > 85 ? 'bad' : '') +
      card('Connections', sl.active_connections ?? '–');
  } catch (e) {
    $('#procs').innerHTML = `<div class="empty">dashboard error: ${esc(e.message)}</div>`;
  }
}

/* ---------- api explorer ---------- */
let ENDPOINTS = []; // [{path, methods:[..]}]
async function loadEndpoints() {
  try {
    const d = await jget('/api');
    ENDPOINTS = (d.routes && d.routes.length)
      ? d.routes
      : (d.endpoints || []).map(p => ({ path: p, methods: ['GET'] }));
    $('#epCount').textContent = d.endpoints_count + ' routes';
    renderEndpoints();
  } catch (e) {
    $('#eplist').innerHTML = `<div class="empty">failed to load /api: ${esc(e.message)}</div>`;
  }
}
function renderEndpoints() {
  const q = $('#q').value.trim().toLowerCase();
  const hits = ENDPOINTS.filter(r => !q || r.path.toLowerCase().includes(q));
  const groups = {};
  for (const r of hits) {
    const parts = r.path.split('/').filter(Boolean);
    const g = parts[0] === 'api' ? '/' + (parts[1] || 'api') : '/';
    (groups[g] = groups[g] || []).push(r);
  }
  $('#eplist').innerHTML = Object.keys(groups).sort().map(g =>
    `<div class="grp">${esc(g)} <span style="color:var(--dim)">(${groups[g].length})</span></div>` +
    groups[g].map(r => {
      const hasParams = r.path.includes('<');
      return `<div class="ep">` +
        r.methods.map(m => `<span class="m m-${esc(m.toLowerCase())}">${esc(m)}</span>`).join('') +
        `<span class="p" data-p="${esc(r.path)}">${esc(r.path)}</span>
        ${hasParams ? '<span class="params">params</span>' : ''}
        <button class="run" data-p="${esc(r.path)}">run</button></div>`;
    }).join('')
  ).join('') || '<div class="empty">no endpoints match</div>';
}
$('#q').addEventListener('input', renderEndpoints);
$('#q').addEventListener('search', renderEndpoints);
$('#eplist').addEventListener('click', e => {
  const p = e.target.dataset && e.target.dataset.p;
  if (p) runEndpoint(p);
});

async function runEndpoint(path) {
  let url = path;
  if (url.includes('<')) {
    let cancelled = false;
    url = url.replace(/<[^>]+>/g, () => {
      const v = prompt('Path parameter value:');
      if (v === null) { cancelled = true; return ''; }
      return encodeURIComponent(v);
    });
    if (cancelled) return;
  }
  // pick the method: prefer GET when a route offers both, else its first method
  const route = ENDPOINTS.find(r => r.path === path);
  const methods = route ? route.methods : ['GET'];
  const method = methods.includes('GET') ? 'GET' : methods[0];
  let body;
  if (method !== 'GET') {
    body = prompt(`JSON request body for ${method} ${path}:`, '{}');
    if (body === null) return;
  }
  const box = $('#resp'); box.style.display = 'block';
  $('#respUrl').textContent = method + ' ' + url;
  $('#respCode').textContent = '…'; $('#respCode').className = 'pill warn';
  $('#respOut').textContent = 'loading…'; $('#respMs').textContent = '';
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  const t0 = performance.now();
  try {
    const opts = { method, headers: { Accept: 'application/json' } };
    if (method !== 'GET') {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = body || '{}';
    }
    const r = await fetch(url, opts);
    const text = await r.text();
    let out = text;
    try { out = JSON.stringify(JSON.parse(text), null, 2); } catch (_) {}
    $('#respOut').textContent = out.length > 200000 ? out.slice(0, 200000) + '\n… truncated' : out;
    $('#respCode').textContent = r.status + ' ' + r.statusText;
    $('#respCode').className = 'pill ' + (r.ok ? 'ok' : 'bad');
    $('#respMs').textContent = Math.round(performance.now() - t0) + ' ms';
  } catch (e) {
    $('#respOut').textContent = 'request failed: ' + e.message;
    $('#respCode').textContent = 'error'; $('#respCode').className = 'pill bad';
  }
}
$('#respClose').addEventListener('click', () => { $('#resp').style.display = 'none'; });

/* ---------- lifecycle ---------- */
async function refreshAll() {
  await Promise.all([loadHealth(), loadProcs()]);
}
$('#refreshNow').addEventListener('click', refreshAll);
setInterval(() => { if ($('#auto').checked) refreshAll(); }, 5000);

refreshAll();
loadEndpoints();
</script>
</body>
</html>
